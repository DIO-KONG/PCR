project:
  name: PCR
  seed: 42

paths:
  raw_dir: data/raw
  cache_dir: data/cache
  results_dir: results

preprocessing:
  voxel_size: 0.8
  remove_statistical_outlier:
    enabled: true
    nb_neighbors: 20
    std_ratio: 2.0
  normals:
    radius_factor: 2.0
    max_nn: 30
  fpfh:
    radius_factor: 5.0
    max_nn: 100
  roi:
    enabled: false
    min_bound: null
    max_bound: null
  cache:
    enabled: true
    dir: data/cache

algorithm:
  name: ransac_all_no_refine
  params:
    coarse_methods:
      - ransac
    coarse_trials: 5
    voxel_sizes:
      - 0.8
    distance_threshold_factors:
      - 2.25
    feature_subsets:
      - all
    top_k_refine: 1
    rigid_refine:
      enabled: false
    affine_mode: none
    score_weights:
      w_fitness: 1.0
      w_overlap: 0.5
      w_rmse: 0.5
      w_trimmed: 0.5
      w_translation: 0.0
      w_coverage: 1.5
      w_degeneracy: 1.2
      w_motion_prior: 0.0

metrics:
  trimmed_ratio: 0.9
  overlap_threshold: 1.0
  orthogonality_tolerance: 1.0e-3

output:
  save_transformed_cloud: true
  save_overlay_cloud: true
  visualize: false
