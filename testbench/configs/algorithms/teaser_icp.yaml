name: teaser_icp
preprocess:
  align_floor: true
  remove_floor: true
  floor_distance_threshold: 0.03
  voxel_size: 0.08
  sor: true
  sor_nb_neighbors: 20
  sor_std_ratio: 1.5
  estimate_normals: true
  normal_radius: 0.20
  normal_max_nn: 30
  floor:
    plane_voxel_size: 0.05
    distance_threshold: 0.03
    max_planes: 8
    max_floor_tilt_deg: 35.0
features:
  fpfh_radius: 0.35
  fpfh_max_nn: 100
teaser:
  noise_bound: 0.08
  cbar2: 1.0
  max_correspondences: 5000
  rotation_gnc_factor: 1.4
  rotation_max_iterations: 100
  rotation_cost_threshold: 1.0e-12
icp:
  max_correspondence_distance: 0.08
  max_iterations: 40
evaluation:
  threshold: 0.08
  trimmed_ratio: 0.8
  max_eval_points: 30000
gate:
  min_source_fitness: 0.35
  min_bidir_fitness_hmean: 0.08
  max_source_trimmed_mean_nn: 0.10
output:
  top_k: 5
