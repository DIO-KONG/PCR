preprocess:
  align_floor: true
  remove_floor: false
submap:
  submap_size: 10
  submap_overlap: 3
  fusion_mode: new_frame_only
  min_submap_steps: 8
  max_submap_steps: 20
  min_fused_batches_for_rotation: 5
  recent_fusion_window: 6
  min_recent_fused_for_rotation: 2
  max_steps_since_fused_for_rotation: 6
  max_provisional_chain: 3
  max_submap_edge_translation: 5.0
  max_submap_edge_rotation_deg: 180.0
quality_gate:
  max_shared_median_error: 0.06
  max_shared_p90_error: 0.12
  max_icp_rmse: 0.08
  min_icp_fitness: 0.35
  max_icp_translation_delta: 0.15
  max_icp_rotation_delta_deg: 5.0
  max_conflict_ratio: 0.3
  enable_scale_shadow_gate: true
  scale_shadow_min_conflict_ratio: 0.55
  scale_shadow_severe_max_icp_fitness: 0.55
  scale_shadow_severe_min_accepted_ratio: 0.05
  scale_shadow_severe_min_xz_area: 25.0
  scale_shadow_severe_min_extent: 7.0
  scale_shadow_early_max_icp_fitness: 0.65
  scale_shadow_early_max_shared_p90_error: 0.1
  scale_shadow_early_min_accepted_ratio: 0.015
  scale_shadow_early_max_accepted_ratio: 0.05
  scale_shadow_early_max_duplicate_ratio: 0.45
  scale_shadow_early_min_xz_area: 15.0
  scale_shadow_early_min_extent: 5.0
fusion:
  voxel_size: 0.06
  duplicate_distance: 0.04
  conflict_distance: 0.15
  normal_angle_deg: 25.0
  normal_radius: 0.18
  normal_max_nn: 30
  conf_percentile: 20.0
  frame_point_stride: 1
  max_points_per_frame: 120000
  random_seed: 7
  floor_distance_threshold: 0.03
  global_preview_voxel_size: 0.08
algorithm:
  frame_combo_size: 3
  sampling:
    conf_percentile: 20.0
    stride: 6
    max_points_per_frame: 8000
    random_seed: 7
  ransac:
    iterations: 3000
    sample_size: 6
    thresholds:
    - 0.18
    - 0.14
    - 0.1
    - 0.06
    evaluation_threshold: 0.06
    min_inliers: 50
    seed: 7
  refinement:
    enabled: true
    thresholds:
    - 0.18
    - 0.14
