    max_correspondence_distance: 0.08
    normal_radius: 0.18
    normal_max_nn: 30
    max_iteration: 40
    max_translation_delta: 0.15
    max_rotation_delta_deg: 5.0
    method: sim3_point_to_point
    max_scale_delta: 0.08
    min_correspondences: 80
    sim3_convergence_rmse_delta: 1.0e-05
